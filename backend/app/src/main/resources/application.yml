spring:
  application:
    name: motorcardgame-app

  config:
    import: optional:file:./.env.properties

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:motorcardgame}
    username: ${DB_USER:motorcardgame}
    password: ${DB_PASSWORD:motorcardgame}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/jwt-private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/jwt-public.pem}
  access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
  refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
