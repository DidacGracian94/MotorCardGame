services:
  postgres:
    image: postgres:16
    container_name: motorcardgame-postgres
    environment:
      POSTGRES_DB: motorcardgame
      POSTGRES_USER: motorcardgame
      POSTGRES_PASSWORD: motorcardgame
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorcardgame -d motorcardgame"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
